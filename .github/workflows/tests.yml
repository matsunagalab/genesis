name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test-linux:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          yum install -y gcc-gfortran lapack-devel blas-devel autoconf automake libtool
          # Use Python 3.11 from manylinux
          ln -sf /opt/python/cp311-cp311/bin/python /usr/local/bin/python
          ln -sf /opt/python/cp311-cp311/bin/pip /usr/local/bin/pip

      - name: Build GENESIS
        run: |
          autoreconf -fi
          # Use the same configuration as build-wheels.yml for consistency.
          # configure.ac's AC_CHECK_LIB auto-detects libmvec availability.
          # Since -ffast-math was removed, libmvec symbols are not generated.
          ./configure --disable-mpi CC=gcc FC=gfortran \
            LAPACK_LIBS="-llapack -lblas"
          make -j$(nproc)
          make install

      - name: Check that the shared library does not need an executable stack
        run: |
          # A trampoline (internal-procedure callback) marks the library RWE and
          # dlopen() then fails on glibc >= 2.41. See error_mod / run_guarded.
          LIB=src/analysis/interface/python_interface/.libs/libpython_interface.so
          readelf -lW "$LIB" | grep GNU_STACK
          if readelf -lW "$LIB" | grep -q 'GNU_STACK.*RWE'; then
            echo "::error::libpython_interface.so requires an executable stack"
            exit 1
          fi

      - name: Install Python package
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          # test_msd and test_diffusion are memory-heavy and marked slow;
          # run them locally with: pytest -m slow
          python -m pytest -m "not slow"

  build-and-test-linux-glibc-2-41:
    # glibc >= 2.41 refuses to dlopen() a library that requires an executable
    # stack. This job builds on a current distribution and loads the library
    # from Python, which is exactly what failed before the error guard used
    # context pointers (see error_mod / run_guarded).
    runs-on: ubuntu-latest
    container:
      image: fedora:42
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y gcc gcc-gfortran lapack-devel blas-devel \
            autoconf automake libtool make binutils git python3 python3-pip

      - name: Build GENESIS
        run: |
          autoreconf -fi
          ./configure --disable-mpi CC=gcc FC=gfortran \
            LAPACK_LIBS="-llapack -lblas"
          make -j$(nproc)
          make install
          readelf -lW src/analysis/interface/python_interface/.libs/libpython_interface.so | grep GNU_STACK

      - name: Install Python package
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install -e ".[dev]"

      - name: Load the library and run guard-path tests
        run: |
          ldd --version | head -1
          /opt/venv/bin/python -m pytest src/genepie/tests/test_rmsd.py \
            src/genepie/tests/test_crd_convert_lazy.py \
            src/genepie/tests/test_error_handling.py

  build-and-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          brew install gcc lapack autoconf automake libtool
          # Create symlink for gfortran (Homebrew installs versioned, e.g., gfortran-14 or gfortran-15)
          GFORTRAN=$(ls $(brew --prefix)/bin/gfortran-* 2>/dev/null | sort -V | tail -1)
          if [ -n "$GFORTRAN" ]; then
            sudo ln -sf "$GFORTRAN" /usr/local/bin/gfortran
            echo "Linked gfortran: $GFORTRAN"
          fi
          gfortran --version

      - name: Build GENESIS
        run: |
          autoreconf -fi
          GCC=$(ls $(brew --prefix)/bin/gcc-* | grep -E 'gcc-[0-9]+$' | sort -V | tail -1)
          ./configure --disable-mpi CC="$GCC" FC=gfortran \
            LAPACK_LIBS="-L$(brew --prefix lapack)/lib -llapack -lblas"
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Install Python package
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          # test_msd and test_diffusion are memory-heavy and marked slow;
          # run them locally with: pytest -m slow
          python -m pytest -m "not slow"
